<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NESA Flask PWA</title>
    <!-- Flask specific asset linking syntax -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>
    <header>
        <h1>Syllabus Web Booking Engine</h1>
        <p id="network-status">🟢 Online</p>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Registers the service worker from the root routing path -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Flask Service Worker Active!', reg))
                    .catch(err => console.error('Registration Failed', err));
            });
        }
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
