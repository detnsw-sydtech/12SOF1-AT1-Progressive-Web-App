<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - System Unavailable</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are currently offline</h1>
        <p>This booking system requires an internet connection to process new network requests.</p>
        <p>Previously cached app features are still browseable, but active operations are paused until connection is restored.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
